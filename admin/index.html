<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#FDF8F5" />
<title>Samhithe Admin</title>
<link rel="icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Samhithe" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--paper:#FDF8F5;--paper-2:#F7EFE8;--line:#EADFD4;--ink:#2B2622;--ink-2:#6A5F57;--clay:#CB5521;--clay-d:#A9431A;--clay-soft:#F7DFD2;--leaf:#4D7A2E;--leaf-soft:#E3EDD5;--warn:#B7791F;--warn-soft:#FBEFD5;--bad:#B3261E;--bad-soft:#FBE3E1;--serif:"DM Serif Display",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--clay)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}

/* layout */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(253,248,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px;object-fit:contain}
.brand b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--clay)}
.brand span{font-size:10.5px;letter-spacing:.16em;color:var(--leaf);font-weight:600;display:block;margin-top:-3px}
.top .sp{flex:1}
.who{font-size:13px;color:var(--ink-2)}
.main{padding:18px 16px 96px;max-width:1080px;width:100%;margin:0 auto}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a,.side a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:12px;font-weight:600}
.bnav a.on,.side a.on{color:var(--clay);background:var(--clay-soft)}
.bnav svg,.side svg{width:22px;height:22px}
@media(min-width:900px){
  .shell{grid-template-columns:230px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:#fff}
  .side .brand{margin:0 6px 20px}
  .side a{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;justify-content:flex-start}
  .side .foot{margin-top:auto;font-size:13px;color:var(--ink-2);padding:0 8px}
  .bnav,.top .brand{display:none}
  .main{padding:26px 34px 60px}
}

/* blocks */
.h1{font-size:clamp(26px,4vw,34px);margin:4px 0 4px}
.sub{color:var(--ink-2);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card+.card,.stack>*+*{margin-top:12px}
.grid{display:grid;gap:12px}
@media(min-width:700px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.sec{font-family:var(--serif);font-size:21px;margin:26px 0 10px}
.stat{display:block;text-decoration:none;color:var(--ink)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink)}
.item+.item{margin-top:8px}
.item:hover{border-color:#d9c6b6}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{flex:none;width:54px;text-align:center;border-radius:12px;background:var(--paper-2);padding:6px 0;line-height:1.15}
.when b{display:block;font-size:15px}
.when small{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.n{background:var(--paper-2);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;white-space:nowrap}
.btn.p{background:var(--clay);color:#fff}
.btn.p:hover{background:var(--clay-d)}
.btn.o{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.o:hover{border-color:var(--ink)}
.btn.g{background:#25D366;color:#fff}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;margin-bottom:12px;font-size:16px}
.search:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--clay)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--ink-2)}
.kv dd{word-break:break-word}
.empty{color:var(--ink-2);padding:14px 2px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:12px}
.okmsg{background:var(--leaf-soft);color:var(--leaf);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:12px;font-weight:600}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa:first-child{border-top:0}
.qa .q{font-size:13.5px;color:var(--ink-2)}
.qa .a{white-space:pre-wrap}
details.acc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.acc+details.acc{margin-top:8px}
details.acc summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--line)}
.note{border-left:3px solid var(--clay-soft);padding:6px 12px;margin-top:10px}
.note .m{font-size:12.5px;color:var(--ink-2)}
.note p{white-space:pre-wrap}
.tx{white-space:pre-wrap;font-size:15px;line-height:1.65}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
mark{background:#FFE9A8;padding:0 2px;border-radius:3px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:600}
.field input,.field textarea,.field select{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:16px;width:100%}
.field textarea{min-height:150px;resize:vertical}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .card{width:100%;max-width:400px;padding:28px 26px}
.auth .brand{justify-content:center;margin-bottom:18px}
.auth .brand img{width:46px;height:46px}
.auth h1{font-size:28px;text-align:center}
.auth .btn{width:100%;margin-top:18px;padding:13px}
.linkbtn{color:var(--clay);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,38,34,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal .x{float:right;font-size:24px;line-height:1;color:var(--ink-2);padding:4px 8px}
.shot{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:12px auto 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--clay);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.grid-av{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:center;margin-top:8px}
.grid-off{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;align-items:center;margin-top:8px}
.grid-av select,.grid-av input,.grid-off input{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper);font-size:15px;width:100%;min-width:0}
@media(max-width:560px){.grid-off{grid-template-columns:1fr 1fr auto}.grid-off .rs{grid-column:1/3}.grid-av{grid-template-columns:1fr 1fr auto;padding-top:10px;border-top:1px solid var(--line)}.grid-av select{grid-column:1/-1}}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:5;background:var(--paper);padding:12px 0;margin-top:8px}
@media(min-width:900px){.savebar{bottom:0}}
.xbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);font-size:18px;line-height:1}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.slot{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:9px 6px;font-weight:600;font-size:14px}
.slot.on{background:var(--clay);border-color:var(--clay);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:none;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:7px 10px;text-align:center;font-size:13px;line-height:1.25}
.day b{display:block;font-size:17px}
.day.on{border-color:var(--clay);background:var(--clay);color:#fff}
.day:disabled{opacity:.4}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--clay);margin-top:2px}
.pill.x{background:#EEE7E1;color:#7c6f66;text-decoration:line-through}
.menu a{display:flex;align-items:center;gap:14px}
.menu svg{width:22px;height:22px;color:var(--clay);flex:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2)}
@media(min-width:900px){.toast{bottom:30px}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* Samhithe admin portal. Talks only to the "Samhithe Admin" Apps Script (see apps-script/admin/).
   This page holds no data or secrets: everything is loaded after sign-in. */
var ADMIN_API = "https://script.google.com/macros/s/AKfycbzHIlWBg_k_9V4DE3zYat7ltuOKWCysWc083ZGYLuuhh0L6g94lFztofkKt-GYrJiIM/exec";
var TZ = "Asia/Kolkata";
var BOOKING_API = "https://script.google.com/macros/s/AKfycbzw67eOs-JR0uudjn1Yu_Z9pp0Zy5-k7r59Glr8W9PoYSTGnGGId2N3mtlUqFlnoMc2/exec";   // public booking engine (for free slots)

(function () {
  var S = { token: null, user: null, d: null, cache: {}, filter: "upcoming", famQ: "", tq: "", tHits: null, tFilter: "linked" };
  // Remembered devices keep the sign-in in localStorage (survives closing the home-screen app); otherwise sessionStorage.
  function store() { try { return localStorage.getItem("sam_admin_t") ? localStorage : sessionStorage; } catch (e) { return sessionStorage; } }
  try { var st0 = store(); S.token = st0.getItem("sam_admin_t"); S.user = JSON.parse(st0.getItem("sam_admin_u") || "null"); } catch (e) {}
  var root = document.getElementById("root");

  /* ── helpers ── */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(sel) { return root.querySelector(sel); }
  var FMT = {};   // date formatters are slow to create, so make each one once
  function fmt(iso, o) {
    if (!iso) return "";
    var k = JSON.stringify(o); var f = FMT[k] || (FMT[k] = new Intl.DateTimeFormat("en-IN", Object.assign({ timeZone: TZ }, o)));
    return f.format(new Date(iso));
  }
  function dDate(iso) { return fmt(iso, { weekday: "short", day: "numeric", month: "short" }); }
  function dLong(iso) { return fmt(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
  function dTime(iso) { return fmt(iso, { hour: "numeric", minute: "2-digit", hour12: true }).toUpperCase(); }
  function dayKey(iso) { return fmt(iso, { year: "numeric", month: "2-digit", day: "2-digit" }); }
  function isToday(iso) { return dayKey(iso) === dayKey(new Date().toISOString()); }
  function rel(iso) {
    var k = dayKey(iso), t = new Date(), tm = new Date(t.getTime() + 86400000);
    if (k === dayKey(t.toISOString())) return "Today"; if (k === dayKey(tm.toISOString())) return "Tomorrow"; return dDate(iso);
  }
  function first(s) { return String(s || "").trim().split(/\s+/)[0] || ""; }
  function waNumber(p) { var d = String(p || "").replace(/\D/g, ""); if (d.length === 10) d = "91" + d; if (d.length === 11 && d[0] === "0") d = "91" + d.slice(1); return d; }
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function statusPill(s) { var c = s === "Verified" ? "ok" : s === "Problem" ? "bad" : "wait"; return '<span class="pill ' + c + '">' + esc(s || "To verify") + "</span>"; }
  function isAdmin() { return S.user && S.user.role === "admin"; }
  var ICON = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
    bookings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    families: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.7-3.6 3.4-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 4 1.8 4.5 4.5"/></svg>',
    transcripts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
    availability: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    enquiries: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>',
    templates: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
  };

  /* ── API ── */
  function api(action, body) {
    body = Object.assign({ action: action, token: S.token }, body || {});
    return fetch(ADMIN_API, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (r) {
      if (r && r.code === "AUTH") { signOut(true); throw new Error("Your session ended. Please sign in again."); }
      return r;
    }, function () { throw new Error("Couldn't reach the server. Check your connection and try again."); });
  }
  // Data: show the last copy from this session instantly, then refresh it from Google in the background.
  function load(force) {
    if (S.d && !force) return Promise.resolve(S.d);
    var fresh = api("data", force ? { fresh: 1 } : {}).then(function (r) {
      if (!r.ok) throw new Error(r.message);
      var changed = !S.d || JSON.stringify(strip(S.d)) !== JSON.stringify(strip(r));
      S.d = r; try { store().setItem("sam_admin_d", JSON.stringify(r)); } catch (e) {}
      return changed;
    });
    var cached = null;
    if (!force) { try { cached = JSON.parse(store().getItem("sam_admin_d") || "null"); } catch (e) {} }
    if (cached && cached.ok) {
      S.d = cached;
      fresh.then(function (changed) { if (changed && !document.querySelector(".modal") && !document.querySelector(".main input:focus,.main textarea:focus")) route(); }).catch(function () {});
      return Promise.resolve(S.d);
    }
    return fresh.then(function () { return S.d; });
  }
  function strip(d) { var x = Object.assign({}, d); delete x.now; return x; }
  function signOut(silent) {
    if (!silent && S.token) api("logout").catch(function () {});
    S.token = null; S.user = null; S.d = null; S.cache = {}; S.prefetched = false;
    try { [localStorage, sessionStorage].forEach(function (x) { ["sam_admin_t", "sam_admin_u", "sam_admin_d"].forEach(function (k) { x.removeItem(k); }); }); } catch (e) {}
    if (!silent) location.hash = "";
    route();
  }

  /* ── auth screens ── */
  function authShell(inner) {
    root.innerHTML = '<div class="auth"><div class="card"><a class="brand" href="../"><img src="../blog/assets/mark.webp" alt="" /><span><b>Samhithe</b><span>ADMIN</span></span></a>' + inner + "</div></div>";
  }
  function loginView(msg) {
    authShell('<h1>Sign in</h1><form id="f"><div class="field"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" required /></div>' +
      '<div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required /></div>' +
      '<label class="check"><input type="checkbox" id="rm" checked /> <span>Keep me signed in on this device</span></label>' +
      '<button class="btn p" id="go">Sign in</button></form><p style="text-align:center;margin-top:16px"><button class="linkbtn" id="fg">Forgot password / set password</button></p>' +
      (msg ? '<div class="okmsg">' + esc(msg) + "</div>" : "") + '<div class="err" id="e" hidden></div>');
    $("#f").onsubmit = function (ev) {
      ev.preventDefault(); var b = $("#go"); b.disabled = true; b.textContent = "Signing in…"; $("#e").hidden = true;
      var keep = $("#rm").checked;
      api("login", { username: $("#u").value.trim(), password: $("#p").value, remember: keep }).then(function (r) {
        if (!r.ok) throw new Error(r.message); signedIn(r, keep);
      }).catch(function (e) { b.disabled = false; b.textContent = "Sign in"; $("#e").textContent = e.message; $("#e").hidden = false; });
    };
    $("#fg").onclick = function () { forgotView($("#u").value.trim()); };
  }
  function forgotView(u) {

        $("#ao").onclick = function () { A.off.push([today, "", ""]); draw(); };
        $("#sv").onclick = function () {
          var bad = A.weekly.filter(function (w) { return !w[1] || !w[2] || w[2] <= w[1]; }).length ? "Each block needs a start time before its end time." :
            A.off.filter(function (o) { return !o[0] || (o[1] && o[1] < o[0]); }).length ? "Each time-off row needs a start date, and the end can't be before the start." : "";
          if (bad) { $("#am").innerHTML = '<div class="err">' + esc(bad) + "</div>"; return; }
          var btn = this; btn.disabled = true; btn.textContent = "Saving…";
          var sets = {}; A.settings.forEach(function (x) { sets[x.label] = Number(x.value); });
          api("saveAvailability", { weekly: A.weekly, timeOff: A.off, settings: sets }).then(function (x) {
            if (!x.ok) throw new Error(x.message);
            S.cache.av = x; A.weekly = x.weekly; A.off = x.timeOff; A.settings = x.settings; draw(); toast("Saved – booking page updates within a minute");
          }).catch(function (e) { btn.disabled = false; btn.textContent = "Save changes"; $("#am").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
        };
      }
      draw();
    }).catch(function (e) { fail("availability", e); });
  }

  /* ── School enquiries ── */
  function enquiriesView() {
    loading("enquiries");
    load(true).then(function (d) {
      var list = d.enquiries.slice().reverse();
      var html = '<h1 class="h1">School enquiries</h1><p class="sub">Call-back requests from preschools and schools on the booking page.</p>' +
        (list.length ? list.map(function (q) {
          var st = q.Status || "New";
          return '<div class="card"><div class="row"><div class="grow"><h3 style="font-size:20px">' + esc(q.School) + '</h3><p class="small muted">' + (q["Received At"] ? dDate(q["Received At"]) : "") + (q["Area / City"] ? " · " + esc(q["Area / City"]) : "") + "</p></div>" +
            '<select data-q="' + q.row + '" style="border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff">' + ["New", "Called", "Follow up", "Closed"].map(function (x) { return "<option" + (x === st ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select></div>" +
            '<dl class="kv" style="margin-top:10px"><dt>Contact</dt><dd>' + esc(q["Contact Person"]) + (q.Role ? ", " + esc(q.Role) : "") + "</dd><dt>Phone</dt><dd>" + esc(q.Phone) + "</dd>" + (q.Email ? "<dt>Email</dt><dd>" + esc(q.Email) + "</dd>" : "") +
            (q["Children & Ages"] ? "<dt>Children</dt><dd>" + esc(q["Children & Ages"]) + "</dd>" : "") + (q["Interested In"] ? "<dt>Interested in</dt><dd>" + esc(q["Interested In"]) + "</dd>" : "") +
            "<dt>Best time</dt><dd>" + esc(q["Best Time to Call"] || "Any time") + "</dd>" + (q.Message ? "<dt>Message</dt><dd style=\"white-space:pre-wrap\">" + esc(q.Message) + "</dd>" : "") + "</dl>" +
            '<div class="btns" style="margin-top:12px"><a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/' + waNumber(q.Phone) + "?text=" + encodeURIComponent("Hi " + first(q["Contact Person"]) + ", this is Nidhi from Samhithe. Thank you for your enquiry for " + q.School + ". ") + '">WhatsApp</a>' +
            '<a class="btn o sm" href="tel:' + esc(q.Phone) + '">Call</a>' + (q.Email ? '<a class="btn o sm" href="mailto:' + esc(q.Email) + '">Email</a>' : "") + "</div></div>";
        }).join("") : '<p class="empty">No enquiries yet.</p>');
      shell("enquiries", html);
      [].forEach.call(root.querySelectorAll("[data-q]"), function (sel) {
        sel.onchange = function () { sel.disabled = true; api("setEnquiry", { row: +sel.dataset.q, status: sel.value }).then(function (r) { if (!r.ok) throw new Error(r.message); sel.disabled = false; toast("Marked " + sel.value); S.d = null; }).catch(function (e) { sel.disabled = false; toast(e.message); }); };
      });
    }).catch(function (e) { fail("enquiries", e); });
  }

  /* ── Message templates ── */
  function templatesView() {
    loading("templates");
    load().then(function (d) {
      var T = d.templates.map(function (t) { return Object.assign({}, t); });
      shell("templates", '<h1 class="h1">Message templates</h1><p class="sub">Used for WhatsApp messages and emails to parents. You can use {parent}, {child}, {date}, {time}, {meet}, {fee} and, for cancellations, {reason}.</p>' +
        T.map(function (t, i) {
          return '<details class="acc"' + (i ? "" : " open") + "><summary><span>" + esc(t.name) + '</span><span class="muted small">' + esc(t.key) + '</span></summary><div style="padding:6px 0 14px">' +
            '<div class="field"><label>Name</label><input data-t="' + i + '" data-k="name" value="' + esc(t.name) + '" /></div>' +
            '<div class="field"><label>Email subject</label><input data-t="' + i + '" data-k="subject" value="' + esc(t.subject) + '" /></div>' +
            '<div class="field"><label>Message</label><textarea data-t="' + i + '" data-k="body">' + esc(t.body) + "</textarea></div></div></details>";
        }).join("") + '<div class="btns" style="margin-top:16px"><button class="btn p" id="sv">Save templates</button></div><div id="tm"></div>');
      [].forEach.call(root.querySelectorAll("[data-t]"), function (el) { el.oninput = function () { T[+el.dataset.t][el.dataset.k] = el.value; }; });
      $("#sv").onclick = function () {
        var btn = this; btn.disabled = true; btn.textContent = "Saving…";
        api("saveTemplates", { templates: T }).then(function (r) { if (!r.ok) throw new Error(r.message); S.d.templates = r.templates; btn.disabled = false; btn.textContent = "Save templates"; toast("Templates saved"); })
          .catch(function (e) { btn.disabled = false; btn.textContent = "Save templates"; $("#tm").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
      };
    }).catch(function (e) { fail("templates", e); });
  }

  /* ── Users ── */
  function usersView() {
    loading("users");
    api("users").then(function (r) {
      if (!r.ok) throw new Error(r.message);
      function form(u) {
        var n = !u; u = u || { role: "assistant", active: true };
        return '<form class="card uf" data-new="' + (n ? 1 : 0) + '"><h3 style="font-size:19px">' + (n ? "Add a user" : esc(u.name) + ' <span class="muted small">@' + esc(u.username) + "</span>") + "</h3>" +
          '<div class="grid two"><div class="field"><label>Username</label><input name="username" value="' + esc(u.username || "") + '"' + (n ? "" : " readonly") + ' autocapitalize="none" /></div>' +
          '<div class="field"><label>Name</label><input name="name" value="' + esc(u.name || "") + '" /></div><div class="field"><label>Email (for password links)</label><input name="email" type="email" value="' + esc(u.email || "") + '" /></div>' +
          '<div class="field"><label>Role</label><select name="role"><option value="assistant"' + (u.role === "assistant" ? " selected" : "") + '>Assistant – bookings, availability, families (no intake or transcripts)</option><option value="admin"' + (u.role === "admin" ? " selected" : "") + ">Admin – everything</option></select></div></div>" +
          '<label class="check"><input type="checkbox" name="active"' + (u.active ? " checked" : "") + " /> <span>Active (can sign in)</span></label>" +
          (n ? "" : '<p class="small muted" style="margin-top:8px">' + (u.hasPassword ? "Password set" : "No password yet") + (u.lastLogin ? " · last sign-in " + dDate(u.lastLogin) : "") + "</p>") +
          '<div class="btns" style="margin-top:12px"><button class="btn p sm">' + (n ? "Add user" : "Save") + "</button>" + (n ? "" : '<button type="button" class="btn o sm" data-link="' + esc(u.username) + '">Email password link</button>') + "</div><div class=\"um\"></div></form>";
      }
      shell("users", '<h1 class="h1">Users</h1><p class="sub">People who can sign in to this portal. New users get their password through an emailed link.</p>' +
        r.users.map(form).join("") + form(null));
      [].forEach.call(root.querySelectorAll("form.uf"), function (f) {
        f.onsubmit = function (ev) {
          ev.preventDefault(); var btn = f.querySelector("button.p"); btn.disabled = true;
          var el = f.elements; api("saveUser", { isNew: f.dataset.new === "1", username: el["username"].value, name: el["name"].value, email: el["email"].value, role: el["role"].value, active: el["active"].checked }).then(function (x) {
            if (!x.ok) throw new Error(x.message); toast("Saved"); usersView();
          }).catch(function (e) { btn.disabled = false; f.querySelector(".um").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
        };
      });
      [].forEach.call(root.querySelectorAll("[data-link]"), function (b) {
        b.onclick = function () { b.disabled = true; api("sendLink", { username: b.dataset.link }).then(function (x) { toast(x.message || "Sent"); }).catch(function (e) { toast(e.message); b.disabled = false; }); };
      });
    }).catch(function (e) { fail("users", e); });
  }

  /* ── change password ── */
  function changePw() {
    var m = modal('<h2 style="font-size:22px">Change password</h2><form id="cp"><div class="field"><label>Current password</label><input id="c0" type="password" autocomplete="current-password" required /></div>' +
      '<div class="field"><label>New password (10+ characters, letters and numbers)</label><input id="c1" type="password" autocomplete="new-password" required /></div>' +
      '<button class="btn p" style="margin-top:16px">Save</button></form><div id="cm"></div>');
    m.querySelector("#cp").onsubmit = function (ev) {
      ev.preventDefault();
      api("changePassword", { current: m.querySelector("#c0").value, password: m.querySelector("#c1").value }).then(function (r) {
        m.querySelector("#cm").innerHTML = '<div class="' + (r.ok ? "okmsg" : "err") + '">' + esc(r.message) + "</div>";
      }).catch(function (e) { m.querySelector("#cm").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
    };
  }

  /* ── router ── */
  function route() {
    var h = location.hash.slice(1);
    var rm = h.match(/^reset=([a-f0-9]{64})$/);
    if (rm) return resetView(rm[1]);
    if (!ADMIN_API) { authShell('<h1>Not connected</h1><p class="muted" style="text-align:center">The admin backend URL has not been set yet.</p>'); return; }
    if (!S.token) return loginView();
    document.querySelectorAll(".modal").forEach(function (m) { m.remove(); });
    window.scrollTo(0, 0);
    var p = h.split("/"), id = decodeURIComponent(p.slice(1).join("/"));
    if (p[0] === "bookings") return bookingsView();
    if (p[0] === "booking") return bookingView(+id);
    if (p[0] === "families") return familiesView();
    if (p[0] === "family") return familyView(id);
    if (p[0] === "transcripts" && isAdmin()) return transcriptsView();
    if (p[0] === "transcript" && isAdmin()) return transcriptView(id);
    if (p[0] === "more") return moreView();
    if (p[0] === "availability") return availabilityView();
    if (p[0] === "enquiries") return enquiriesView();
    if (p[0] === "templates" && isAdmin()) return templatesView();
    if (p[0] === "users" && isAdmin()) return usersView();
    return todayView();
  }
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); S.bip = e; });
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  route();
})();
</script>
</body>
</html>
